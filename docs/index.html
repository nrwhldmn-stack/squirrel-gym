<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squirrel Debug</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #f0f0f0; font-family: sans-serif; padding: 16px; }
  .box { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin-bottom: 8px; }
  .val { font-size: 13px; color: #6ee7b7; word-break: break-all; }
</style>
</head>
<body>
<div class="box" style="background:#ef4444;color:#fff">
  <h2>🔴 STEP 1 — HTML renders</h2>
  <p class="val">If you see this red box, HTML + CSS is working</p>
</div>

<div class="box" id="tg-box">
  <h2>📱 Telegram SDK</h2>
  <p class="val" id="tg-status">checking...</p>
</div>

<div class="box" id="viewport-box">
  <h2>📐 Viewport</h2>
  <p class="val" id="vp-size">checking...</p>
</div>

<div class="box" id="api-box">
  <h2>🌐 API call</h2>
  <p class="val" id="api-status">checking...</p>
</div>

<div class="box">
  <h2>✅ All checks done</h2>
  <p class="val">Report back what you see</p>
</div>

<script>
// TG SDK check
const tgEl = document.getElementById('tg-status');
if (window.Telegram && window.Telegram.WebApp) {
  tgEl.textContent = 'SDK loaded ✓ | isExpanded: ' + Telegram.WebApp.isExpanded + ' | h: ' + Telegram.WebApp.viewportHeight;
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
} else {
  tgEl.textContent = 'SDK NOT loaded (normal in browser)';
}

// Viewport
document.getElementById('vp-size').textContent = 
  'window: ' + window.innerWidth + 'x' + window.innerHeight + 
  ' | screen: ' + screen.width + 'x' + screen.height;

// API test
fetch('https://squirrel-gym-production.up.railway.app/health')
  .then(r => r.json())
  .then(d => { document.getElementById('api-status').textContent = 'OK: ' + JSON.stringify(d); })
  .catch(e => { document.getElementById('api-status').textContent = 'FAIL: ' + e.message; document.getElementById('api-box').style.background = '#ef4444'; });
</script>
</body>
</html>
