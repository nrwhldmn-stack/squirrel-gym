<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Squirrel Gym 🐿️</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --accent: #6ee7b7;
    --accent2: #3b82f6;
    --text: #f0f0f0;
    --muted: #888;
    --danger: #ef4444;
    --success: #22c55e;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  
  .nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-btn { flex: 1; padding: 12px 4px; border: none; background: none; color: var(--muted); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .2s; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn span { font-size: 20px; }

  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
  h3 { font-size: 15px; font-weight: 600; }
  
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-green { background: rgba(110,231,183,.15); color: var(--accent); }
  .badge-blue { background: rgba(59,130,246,.15); color: var(--accent2); }
  .badge-red { background: rgba(239,68,68,.15); color: var(--danger); }

  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 700; }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-trend { font-size: 12px; margin-top: 2px; }
  .up { color: var(--success); }
  .down { color: var(--danger); }

  .workout-day { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .workout-day:hover { border-color: var(--accent); }
  .workout-day.today { border-color: var(--accent); }
  .day-info { flex: 1; }
  .day-name { font-weight: 600; font-size: 15px; }
  .day-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chevron { color: var(--muted); font-size: 18px; }

  .exercise-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .ex-name { font-weight: 600; font-size: 15px; }
  .ex-target { font-size: 12px; color: var(--muted); }
  .last-week { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .last-week strong { color: var(--accent2); }
  .set-inputs { display: flex; gap: 8px; }
  .set-input-group { flex: 1; }
  .set-input-group label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
  .set-input-group input { width: 100%; background: #111; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 16px; text-align: center; }
  .set-input-group input:focus { outline: none; border-color: var(--accent); }
  .notes-small { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }

  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity .2s; }
  .btn:active { opacity: .8; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }

  .form-group { margin-bottom: 14px; }
  .form-group label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
  .form-group input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-size: 16px; }
  .form-group input:focus { outline: none; border-color: var(--accent); }

  .progress-bar-wrap { background: var(--border); border-radius: 4px; height: 6px; margin-top: 6px; }
  .progress-bar { background: var(--accent); border-radius: 4px; height: 6px; transition: width .5s; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; padding: 12px 24px; border-radius: 24px; font-weight: 600; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .back-btn { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 0 0 16px 0; display: flex; align-items: center; gap: 6px; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .history-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .history-date { font-size: 13px; font-weight: 600; }
  .history-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .history-vol { font-size: 18px; font-weight: 700; color: var(--accent); }
  .history-vol-lbl { font-size: 10px; color: var(--muted); text-align: right; }
</style>
</head>
<body>

<div id="toast" class="toast">✅ Saved!</div>

<!-- SCREENS -->
<div id="screen-home" class="screen active">
  <div style="padding-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <h1>Squirrel Gym 🐿️</h1>
        <div style="font-size:13px;color:var(--muted)" id="home-date"></div>
      </div>
      <div id="home-streak" style="text-align:right"></div>
    </div>

    <div class="stat-row" id="home-stats">
      <div class="stat"><div class="stat-val" id="stat-bf">—</div><div class="stat-lbl">Body Fat %</div><div class="stat-trend" id="stat-bf-trend"></div></div>
      <div class="stat"><div class="stat-val" id="stat-weight">—</div><div class="stat-lbl">Weight lbs</div><div class="stat-trend" id="stat-weight-trend"></div></div>
      <div class="stat"><div class="stat-val" id="stat-sessions">0</div><div class="stat-lbl">Sessions</div></div>
    </div>

    <div class="card">
      <div class="card-title">This Week</div>
      <div id="weekly-schedule"></div>
    </div>

    <div id="today-cta"></div>
  </div>
</div>

<div id="screen-workout" class="screen">
  <div id="workout-list-view">
    <h2>Workouts</h2>
    <div id="workout-days-list"></div>
  </div>
  <div id="workout-session-view" style="display:none">
    <button class="back-btn" onclick="showWorkoutList()">← Back</button>
    <div id="session-content"></div>
  </div>
</div>

<div id="screen-metrics" class="screen">
  <h2>Body Metrics</h2>
  <div class="card">
    <div class="card-title">Log Today</div>
    <div class="metric-grid">
      <div class="form-group"><label>Weight (lbs)</label><input type="number" id="m-weight" placeholder="186" step="0.1"></div>
      <div class="form-group"><label>Body Fat %</label><input type="number" id="m-bf" placeholder="15.0" step="0.1"></div>
      <div class="form-group"><label>Muscle Mass %</label><input type="number" id="m-muscle" placeholder="42" step="0.1"></div>
      <div class="form-group"><label>Waist (cm)</label><input type="number" id="m-waist" placeholder="85" step="0.5"></div>
      <div class="form-group"><label>Chest (cm)</label><input type="number" id="m-chest" placeholder="100" step="0.5"></div>
      <div class="form-group"><label>Arm (cm)</label><input type="number" id="m-arm" placeholder="35" step="0.5"></div>
    </div>
    <div class="form-group"><label>Notes</label><input type="text" id="m-notes" placeholder="Feeling lean today..."></div>
    <button class="btn btn-primary" onclick="logMetrics()">Save Metrics</button>
  </div>
  <div id="metrics-history"></div>
</div>

<div id="screen-progress" class="screen">
  <h2>Progress</h2>
  <div id="progress-content"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('home')" id="nav-home"><span>🏠</span>Home</button>
  <button class="nav-btn" onclick="showScreen('workout')" id="nav-workout"><span>🏋️</span>Workout</button>
  <button class="nav-btn" onclick="showScreen('metrics')" id="nav-metrics"><span>📊</span>Metrics</button>
  <button class="nav-btn" onclick="showScreen('progress')" id="nav-progress"><span>📈</span>Progress</button>
</nav>

<script>
const API = '';
const USER_ID = 7955194359;
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_LABELS = {0:'A', 2:'B', 4:'C'};

let program = null;
let currentDayLabel = null;
let sessionData = {};

async function api(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name === 'progress') loadProgress();
  if (name === 'metrics') loadMetricsHistory();
}

function showToast(msg='✅ Saved!') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// HOME
async function loadHome() {
  const today = new Date();
  document.getElementById('home-date').textContent = today.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  
  const [todayData, sessions, metrics] = await Promise.all([
    api('/api/today?user_id='+USER_ID),
    api('/api/sessions?user_id='+USER_ID+'&limit=50'),
    api('/api/metrics?user_id='+USER_ID+'&limit=7')
  ]);

  // Stats
  document.getElementById('stat-sessions').textContent = sessions.length;
  if (metrics.length > 0) {
    const latest = metrics[0];
    document.getElementById('stat-bf').textContent = latest.body_fat_pct ? latest.body_fat_pct.toFixed(1)+'%' : '—';
    document.getElementById('stat-weight').textContent = latest.weight_lbs ? latest.weight_lbs.toFixed(1) : '—';
    if (metrics.length > 1) {
      const prev = metrics[1];
      if (latest.body_fat_pct && prev.body_fat_pct) {
        const diff = (latest.body_fat_pct - prev.body_fat_pct).toFixed(1);
        const el = document.getElementById('stat-bf-trend');
        el.textContent = (diff > 0 ? '▲' : '▼') + Math.abs(diff) + '%';
        el.className = 'stat-trend ' + (diff > 0 ? 'up' : 'down');
      }
      if (latest.weight_lbs && prev.weight_lbs) {
        const diff = (latest.weight_lbs - prev.weight_lbs).toFixed(1);
        const el = document.getElementById('stat-weight-trend');
        el.textContent = (diff > 0 ? '▲' : '▼') + Math.abs(diff) + 'lbs';
        el.className = 'stat-trend ' + (diff > 0 ? 'up' : 'down');
      }
    }
  }

  // Weekly schedule
  const weekEl = document.getElementById('weekly-schedule');
  const todayDow = today.getDay() === 0 ? 6 : today.getDay() - 1;
  const weekDays = [
    {dow:0, label:'A', name:'Chest + Tris + Shoulders', day:'Mon'},
    {dow:1, label:null, name:'Lagree 🧘', day:'Tue'},
    {dow:2, label:'B', name:'Back + Bis + Rear Delts', day:'Wed'},
    {dow:3, label:null, name:'Lagree 🧘', day:'Thu'},
    {dow:4, label:'C', name:'Shoulders + Arms', day:'Fri'},
    {dow:5, label:null, name:'Lagree / Rest', day:'Sat'},
    {dow:6, label:null, name:'Rest', day:'Sun'},
  ];
  weekEl.innerHTML = weekDays.map(d => `
    <div style="display:flex;align-items:center;padding:8px 0;${d.dow < weekDays.length-1 ? 'border-bottom:1px solid var(--border)':''};opacity:${d.dow < todayDow ? '.5':'1'}">
      <div style="width:36px;font-size:12px;color:var(--muted)">${d.day}</div>
      <div style="flex:1;font-size:13px${d.dow===todayDow?';font-weight:700;color:var(--accent)':''}">${d.name}</div>
      ${d.dow===todayDow ? '<div style="font-size:11px;color:var(--accent)">TODAY</div>' : ''}
    </div>
  `).join('');

  // CTA
  const ctaEl = document.getElementById('today-cta');
  if (todayData.rest_day) {
    ctaEl.innerHTML = `<div class="card" style="text-align:center;color:var(--muted)"><div style="font-size:32px">🧘</div><div style="margin-top:8px">${todayData.message}</div></div>`;
  } else {
    ctaEl.innerHTML = `
      <button class="btn btn-primary" style="margin-top:0" onclick="openWorkout('${todayData.day_label}')">
        🏋️ Start Today's Workout — Day ${todayData.day_label}
      </button>`;
  }
}

// WORKOUT
function showWorkoutList() {
  document.getElementById('workout-list-view').style.display = 'block';
  document.getElementById('workout-session-view').style.display = 'none';
}

async function loadWorkoutList() {
  if (!program) program = await api('/api/program');
  const el = document.getElementById('workout-days-list');
  const todayDow = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
  const todayLabel = DAY_LABELS[todayDow];
  
  el.innerHTML = Object.entries(program).map(([label, w]) => `
    <div class="workout-day${label===todayLabel?' today':''}" onclick="openWorkout('${label}')">
      <div class="day-info">
        <div class="day-name">Day ${label} — ${label==='A'?'Monday':label==='B'?'Wednesday':'Friday'}</div>
        <div class="day-sub">${w.name}</div>
        <div style="margin-top:6px">${w.exercises.map(e=>`<span style="font-size:11px;color:var(--muted);margin-right:8px">${e.name}</span>`).join('')}</div>
      </div>
      <div class="chevron">›</div>
    </div>
  `).join('');
}

async function openWorkout(dayLabel) {
  showScreen('workout');
  currentDayLabel = dayLabel;
  sessionData = {};
  
  document.getElementById('workout-list-view').style.display = 'none';
  document.getElementById('workout-session-view').style.display = 'block';
  
  const data = await api(`/api/workout/${dayLabel}?user_id=${USER_ID}`);
  const w = data.workout;
  
  const el = document.getElementById('session-content');
  el.innerHTML = `
    <h2>Day ${dayLabel} — ${w.name}</h2>
    ${w.exercises.map((ex, i) => `
      <div class="exercise-card" id="ex-card-${i}">
        <div class="ex-header">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-target">${ex.sets} sets × ${ex.reps} reps</div>
          </div>
          <div id="ex-pr-${i}"></div>
        </div>
        ${ex.last_weight ? `
          <div class="last-week">
            Last week: <strong>${ex.last_weight}lbs × ${ex.last_reps} reps × ${ex.last_sets} sets</strong>
            <span style="margin-left:6px">= ${(ex.last_weight*ex.last_reps*ex.last_sets).toFixed(0)} vol</span>
          </div>
        ` : `<div class="last-week" style="color:var(--muted)">No previous data — set your baseline today</div>`}
        <div class="set-inputs">
          <div class="set-input-group">
            <label>Weight (lbs)</label>
            <input type="number" id="weight-${i}" placeholder="${ex.last_weight || '0'}" step="2.5"
              oninput="updateSession(${i}, '${ex.id}', '${ex.name}')" value="${ex.last_weight || ''}">
          </div>
          <div class="set-input-group">
            <label>Reps</label>
            <input type="number" id="reps-${i}" placeholder="${ex.last_reps || ex.reps.split('-')[0]}"
              oninput="updateSession(${i}, '${ex.id}', '${ex.name}')" value="${ex.last_reps || ''}">
          </div>
          <div class="set-input-group">
            <label>Sets</label>
            <input type="number" id="sets-${i}" placeholder="${ex.sets}"
              oninput="updateSession(${i}, '${ex.id}', '${ex.name}')" value="${ex.sets}">
          </div>
        </div>
        ${ex.notes ? `<div class="notes-small">💡 ${ex.notes}</div>` : ''}
      </div>
    `).join('')}
    <button class="btn btn-primary" onclick="saveSession()">✅ Complete Workout</button>
    <div style="height:80px"></div>
  `;
}

function updateSession(idx, exId, exName) {
  const w = parseFloat(document.getElementById('weight-'+idx)?.value) || 0;
  const r = parseFloat(document.getElementById('reps-'+idx)?.value) || 0;
  const s = parseFloat(document.getElementById('sets-'+idx)?.value) || 0;
  sessionData[idx] = { exercise_id: exId, name: exName, weight: w, reps: r, sets: s };
  
  // Check PR
  const prEl = document.getElementById('ex-pr-'+idx);
  if (prEl && w > 0 && r > 0 && s > 0) {
    prEl.innerHTML = '<span class="badge badge-green">🔥 PR?</span>';
  }
}

async function saveSession() {
  const exercises = Object.values(sessionData).filter(e => e.weight > 0);
  if (exercises.length === 0) {
    showToast('⚠️ Log at least one exercise');
    return;
  }
  await api('/api/workout/log', 'POST', { user_id: USER_ID, day_label: currentDayLabel, exercises });
  showToast('🏋️ Workout saved!');
  setTimeout(() => { showWorkoutList(); showScreen('home'); loadHome(); }, 1500);
}

// METRICS
async function logMetrics() {
  const data = {
    user_id: USER_ID,
    weight_lbs: parseFloat(document.getElementById('m-weight').value) || null,
    body_fat_pct: parseFloat(document.getElementById('m-bf').value) || null,
    muscle_mass_pct: parseFloat(document.getElementById('m-muscle').value) || null,
    waist_cm: parseFloat(document.getElementById('m-waist').value) || null,
    chest_cm: parseFloat(document.getElementById('m-chest').value) || null,
    arm_cm: parseFloat(document.getElementById('m-arm').value) || null,
    notes: document.getElementById('m-notes').value || null
  };
  await api('/api/metrics', 'POST', data);
  showToast('📊 Metrics saved!');
  loadMetricsHistory();
  loadHome();
}

async function loadMetricsHistory() {
  const metrics = await api('/api/metrics?user_id='+USER_ID+'&limit=14');
  const el = document.getElementById('metrics-history');
  if (!metrics.length) { el.innerHTML = '<div class="empty-state"><div class="icon">📊</div>No metrics yet</div>'; return; }
  el.innerHTML = '<h3 style="margin-bottom:10px">History</h3>' + metrics.map(m => `
    <div class="history-item">
      <div>
        <div class="history-date">${new Date(m.metric_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
        <div class="history-sub">${m.weight_lbs ? m.weight_lbs+'lbs' : ''} ${m.body_fat_pct ? '· '+m.body_fat_pct+'% BF' : ''} ${m.muscle_mass_pct ? '· '+m.muscle_mass_pct+'% muscle' : ''}</div>
        ${m.notes ? `<div class="history-sub" style="margin-top:2px;font-style:italic">${m.notes}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// PROGRESS
async function loadProgress() {
  if (!program) program = await api('/api/program');
  const sessions = await api('/api/sessions?user_id='+USER_ID+'&limit=100');
  
  const el = document.getElementById('progress-content');
  if (!sessions.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📈</div><p>Complete a workout to see progress</p></div>';
    return;
  }

  // Build per-exercise progression
  const exMap = {};
  sessions.forEach(s => {
    if (!s.exercises) return;
    s.exercises.forEach(ex => {
      if (!exMap[ex.exercise_id]) exMap[ex.exercise_id] = { name: ex.name, data: [] };
      exMap[ex.exercise_id].data.push({
        date: s.session_date,
        weight: ex.weight,
        reps: ex.reps,
        sets: ex.sets,
        vol: (ex.weight||0) * (ex.reps||0) * (ex.sets||0)
      });
    });
  });

  el.innerHTML = Object.entries(exMap).map(([id, ex]) => {
    const sorted = ex.data.sort((a,b) => new Date(a.date)-new Date(b.date));
    const latest = sorted[sorted.length-1];
    const prev = sorted.length > 1 ? sorted[sorted.length-2] : null;
    const maxVol = Math.max(...sorted.map(d=>d.vol));
    const pct = maxVol > 0 ? (latest.vol / maxVol * 100) : 0;
    const volDiff = prev ? latest.vol - prev.vol : 0;
    
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="h3">${ex.name}</div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:700">${latest.weight}lbs</div>
            <div style="font-size:11px;color:var(--muted)">${latest.reps}r × ${latest.sets}s</div>
          </div>
        </div>
        <div class="progress-bar-wrap" style="margin-top:10px">
          <div class="progress-bar" style="width:${pct}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)">
          <span>Vol: ${latest.vol.toFixed(0)}</span>
          <span class="${volDiff >= 0 ? 'up' : 'down'}">${volDiff >= 0 ? '▲' : '▼'} ${Math.abs(volDiff).toFixed(0)} vs last</span>
          <span>${sorted.length} sessions</span>
        </div>
      </div>
    `;
  }).join('');
}

// INIT
async function init() {
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
  await loadHome();
  await loadWorkoutList();
}

init();
</script>
